name: Manual npm release

run-name: Release ${{ inputs.version }} to npm @${{ inputs.npm_tag }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version, for example 0.1.0-rc.1
        required: true
        default: 0.1.0-rc.1
        type: string
      npm_tag:
        description: npm dist-tag used for publication
        required: true
        default: rc
        type: choice
        options:
          - rc
          - beta
          - alpha
          - latest
      dry_run:
        description: Validate everything without publishing or creating GitHub release metadata
        required: true
        default: true
        type: boolean
      release_commit:
        description: Optional original source commit for recovery of an already-published version
        required: false
        default: ""
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate and publish
    runs-on: ubuntu-latest

    env:
      RELEASE_VERSION: ${{ inputs.version }}
      NPM_TAG: ${{ inputs.npm_tag }}
      RELEASE_COMMIT_INPUT: ${{ inputs.release_commit }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify release workflow source
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_NAME" != "main" ]]; then
            echo "::error::Releases must be run from the main branch."
            exit 1
          fi

          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          if [[ "$CHECKED_OUT_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::Checked-out commit does not match the workflow commit."
            exit 1
          fi

          REMOTE_MAIN_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$REMOTE_MAIN_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::main advanced after this release was started."
            echo "Workflow commit: $GITHUB_SHA"
            echo "Current main:    $REMOTE_MAIN_SHA"
            echo "Run the release workflow again from the current main branch."
            exit 1
          fi

          RELEASE_COMMIT="$GITHUB_SHA"
          if [[ -n "${RELEASE_COMMIT_INPUT:-}" ]]; then
            if ! git rev-parse --verify "${RELEASE_COMMIT_INPUT}^{commit}" >/dev/null 2>&1; then
              echo "::error::Recovery release_commit '${RELEASE_COMMIT_INPUT}' is not a valid commit."
              exit 1
            fi

            RELEASE_COMMIT="$(git rev-parse "${RELEASE_COMMIT_INPUT}^{commit}")"
            if ! git merge-base --is-ancestor "$RELEASE_COMMIT" "$GITHUB_SHA"; then
              echo "::error::Recovery release_commit ${RELEASE_COMMIT} is not an ancestor of current main."
              exit 1
            fi

            echo "Recovery mode requested for original release source ${RELEASE_COMMIT}."
          fi

          echo "RELEASE_COMMIT=${RELEASE_COMMIT}" >> "$GITHUB_ENV"
          echo "Workflow source verified: $GITHUB_SHA"
          echo "Release source commit:    $RELEASE_COMMIT"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Verify npm Trusted Publishing support
        shell: bash
        run: |
          set -euo pipefail

          NPM_VERSION="$(npm --version)"
          echo "npm version: $NPM_VERSION"

          node - "$NPM_VERSION" <<'NODE'
          const [major, minor, patch] = process.argv[2].split(".").map(Number);
          const supported =
            major > 11 ||
            (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));

          if (!supported) {
            console.error(
              `npm ${process.argv[2]} is too old for npm Trusted Publishing; npm >= 11.5.1 is required.`,
            );
            process.exit(1);
          }
          NODE

      - name: Install locked dependencies
        run: npm ci

      - name: Validate release metadata
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require("node:fs");

          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          const changelog = fs.readFileSync("CHANGELOG.md", "utf8");
          const readme = fs.readFileSync("README.md", "utf8");
          const reportSchema = fs.readFileSync("src/report-schema.ts", "utf8");
          const version = process.env.RELEASE_VERSION;
          const tag = process.env.NPM_TAG;

          function fail(message) {
            console.error(`Release validation failed: ${message}`);
            process.exit(1);
          }

          if (pkg.private !== false) {
            fail("package.json must contain private=false");
          }

          if (pkg.version !== version) {
            fail(
              `workflow version '${version}' does not match package.json version '${pkg.version}'`,
            );
          }

          if (lock.version !== version || lock.packages?.[""]?.version !== version) {
            fail("package-lock.json version does not match the requested release version");
          }

          if (pkg.publishConfig?.access !== "public") {
            fail("publishConfig.access must be 'public'");
          }

          if (pkg.publishConfig?.tag !== tag) {
            fail(
              `workflow npm tag '${tag}' does not match publishConfig.tag '${pkg.publishConfig?.tag}'`,
            );
          }

          const semver =
            /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/;

          if (!semver.test(version)) {
            fail(`'${version}' is not a valid supported SemVer release`);
          }

          if (tag === "latest") {
            if (version.includes("-")) {
              fail("a prerelease version must not be published under latest");
            }
          } else if (!version.includes(`-${tag}.`)) {
            fail(`version '${version}' does not match npm tag '${tag}'`);
          }

          const expectedRepository =
            `git+https://github.com/${process.env.GITHUB_REPOSITORY}.git`;

          if (pkg.repository?.url !== expectedRepository) {
            fail(
              `repository.url '${pkg.repository?.url}' does not match '${expectedRepository}'`,
            );
          }

          const escapedVersion = version.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          const changelogHeading = new RegExp(`^##\\s+${escapedVersion}\\s*$`, "m");

          if (!changelogHeading.test(changelog)) {
            fail(`CHANGELOG.md does not contain a '## ${version}' section`);
          }

          if (!readme.trim()) {
            fail("README.md must not be empty");
          }

          if (!readme.includes("# ui-behavior-coverage")) {
            fail("README.md is missing the package heading");
          }

          if (!readme.includes(version)) {
            fail(`README.md does not mention release version '${version}'`);
          }

          const toolVersionMatch = reportSchema.match(
            /export const TOOL_VERSION = '([^']+)' as const;/,
          );

          if (!toolVersionMatch) {
            fail("src/report-schema.ts does not expose a recognizable TOOL_VERSION");
          }

          if (toolVersionMatch[1] !== version) {
            fail(
              `TOOL_VERSION '${toolVersionMatch[1]}' does not match release version '${version}'`,
            );
          }

          console.log(`Package: ${pkg.name}`);
          console.log(`Version: ${version}`);
          console.log(`npm tag: ${tag}`);
          console.log(`README bytes: ${Buffer.byteLength(readme, "utf8")}`);
          console.log("Release metadata validated.");
          NODE

      - name: Validate recovery source metadata
        if: ${{ inputs.release_commit != '' }}
        shell: bash
        run: |
          set -euo pipefail

          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT

          git show "${RELEASE_COMMIT}:package.json" > "$TMP_DIR/package.json"
          git show "${RELEASE_COMMIT}:src/report-schema.ts" > "$TMP_DIR/report-schema.ts"

          node - "$TMP_DIR/package.json" "$TMP_DIR/report-schema.ts" <<'NODE'
          const fs = require("node:fs");
          const pkg = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const schema = fs.readFileSync(process.argv[3], "utf8");
          const expected = process.env.RELEASE_VERSION;
          const match = schema.match(/export const TOOL_VERSION = '([^']+)' as const;/);

          if (pkg.version !== expected) {
            console.error(
              `Recovery source package version '${pkg.version}' does not match '${expected}'.`,
            );
            process.exit(1);
          }

          if (!match || match[1] !== expected) {
            console.error(
              `Recovery source TOOL_VERSION does not match '${expected}'.`,
            );
            process.exit(1);
          }
          NODE

          echo "Recovery source metadata matches ${RELEASE_VERSION}."

      - name: Inspect registry and Git tag state
        id: state
        shell: bash
        run: |
          set -euo pipefail

          NAME="$(node -p "require('./package.json').name")"
          TAG="v${RELEASE_VERSION}"

          set +e
          VIEW_OUTPUT="$(npm view "${NAME}@${RELEASE_VERSION}" version 2>&1)"
          VIEW_STATUS=$?
          set -e

          if [[ "$VIEW_STATUS" -eq 0 ]]; then
            if [[ "$VIEW_OUTPUT" != "$RELEASE_VERSION" ]]; then
              echo "::error::Unexpected registry response for ${NAME}@${RELEASE_VERSION}: ${VIEW_OUTPUT}"
              exit 1
            fi

            TAG_VERSION="$(npm view "${NAME}@${NPM_TAG}" version 2>/dev/null || true)"
            if [[ "$TAG_VERSION" != "$RELEASE_VERSION" ]]; then
              echo "::error::${NAME}@${RELEASE_VERSION} already exists, but @${NPM_TAG} points to '${TAG_VERSION}'."
              exit 1
            fi

            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "${NAME}@${RELEASE_VERSION} is already published with @${NPM_TAG}; publication can be skipped safely."
          else
            if ! grep -qE "E404|404 Not Found|No match found" <<< "$VIEW_OUTPUT"; then
              echo "$VIEW_OUTPUT"
              echo "::error::Unable to safely determine npm version availability."
              exit 1
            fi

            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "${NAME}@${RELEASE_VERSION} is available on npm."
          fi

          git fetch --tags origin

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            TAG_TARGET="$(git rev-list -n 1 "${TAG}")"
            if [[ "$TAG_TARGET" != "$RELEASE_COMMIT" ]]; then
              echo "::error::Existing Git tag ${TAG} points to ${TAG_TARGET}, not ${RELEASE_COMMIT}."
              exit 1
            fi
            echo "git_tag_exists=true" >> "$GITHUB_OUTPUT"
            echo "Git tag ${TAG} already points to the intended release commit."
          else
            echo "git_tag_exists=false" >> "$GITHUB_OUTPUT"
            echo "Git tag ${TAG} is available."
          fi

      - name: Require published version for recovery mode
        if: ${{ inputs.release_commit != '' && steps.state.outputs.published != 'true' }}
        shell: bash
        run: |
          echo "::error::release_commit recovery mode is only allowed for a version that is already published on npm."
          exit 1

      - name: Run release checks
        run: npm run release:check

      - name: Build and verify exact release tarball
        id: pack
        shell: bash
        run: |
          set -euo pipefail

          NAME="$(node -p "require('./package.json').name")"
          RECOVERY_MODE=false

          if [[ -n "${RELEASE_COMMIT_INPUT:-}" ]]; then
            RECOVERY_MODE=true
            echo "Recovery mode: downloading the already-published npm artifact."
            TARBALL="$(npm pack "${NAME}@${RELEASE_VERSION}" --silent)"
          else
            TARBALL="$(npm pack --silent)"
          fi

          if [[ ! -f "$TARBALL" ]]; then
            echo "::error::npm pack did not create ${TARBALL}"
            exit 1
          fi

          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "Release artifact: $TARBALL"
          echo
          tar -tzf "$TARBALL"

          if ! tar -tzf "$TARBALL" package/README.md >/dev/null 2>&1; then
            echo "::error::Release tarball does not contain package/README.md."
            exit 1
          fi

          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT
          tar -xzf "$TARBALL" -C "$TMP_DIR" package/README.md package/package.json

          PACKAGED_VERSION="$(node -p "require('$TMP_DIR/package/package.json').version")"
          if [[ "$PACKAGED_VERSION" != "$RELEASE_VERSION" ]]; then
            echo "::error::Tarball package version '${PACKAGED_VERSION}' does not match '${RELEASE_VERSION}'."
            exit 1
          fi

          if [[ "$RECOVERY_MODE" == "true" ]]; then
            git show "${RELEASE_COMMIT}:README.md" > "$TMP_DIR/expected-README.md"
            EXPECTED_README="$TMP_DIR/expected-README.md"
          else
            EXPECTED_README="README.md"
          fi

          if ! cmp -s "$EXPECTED_README" "$TMP_DIR/package/README.md"; then
            echo "::error::README.md in the release tarball differs from the intended release-source README.md."
            exit 1
          fi

          if [[ ! -s "$TMP_DIR/package/README.md" ]]; then
            echo "::error::README.md in the release tarball is empty."
            exit 1
          fi

          echo "Tarball version and README verified ($(wc -c < "$TMP_DIR/package/README.md") README bytes)."

      - name: Archive release package
        uses: actions/upload-artifact@v4
        with:
          name: npm-${{ inputs.version }}
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 30

      - name: npm publish dry run
        if: ${{ inputs.dry_run && inputs.release_commit == '' }}
        run: |
          npm publish \
            "${{ steps.pack.outputs.tarball }}" \
            --access public \
            --tag "$NPM_TAG" \
            --dry-run

      - name: Recovery dry-run summary
        if: ${{ inputs.dry_run && inputs.release_commit != '' }}
        run: echo "Recovery dry run verified the already-published npm artifact and original release source; no publication or GitHub metadata was changed."

      - name: Publish to npm
        if: ${{ !inputs.dry_run && inputs.release_commit == '' && steps.state.outputs.published != 'true' }}
        run: |
          npm publish \
            "${{ steps.pack.outputs.tarball }}" \
            --access public \
            --tag "$NPM_TAG"

      - name: Verify npm release
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail

          NAME="$(node -p "require('./package.json').name")"
          SUCCESS=false

          for attempt in {1..24}; do
            VERSION_RESULT="$(npm view "${NAME}@${RELEASE_VERSION}" version 2>/dev/null || true)"
            TAG_RESULT="$(npm view "${NAME}@${NPM_TAG}" version 2>/dev/null || true)"

            if [[ "$VERSION_RESULT" == "$RELEASE_VERSION" && \
                  "$TAG_RESULT" == "$RELEASE_VERSION" ]]; then
              SUCCESS=true
              break
            fi

            echo "Registry version/dist-tag not fully updated yet; retrying (${attempt}/24)..."
            sleep 5
          done

          if [[ "$SUCCESS" != "true" ]]; then
            echo "::error::Published version or npm dist-tag could not be verified."
            exit 1
          fi

          echo "${NAME}@${RELEASE_VERSION} verified."
          echo "${NPM_TAG} -> ${RELEASE_VERSION} verified."

          README_RESULT="$(npm view "${NAME}@${RELEASE_VERSION}" readme 2>/dev/null || true)"
          if [[ -z "$README_RESULT" ]]; then
            echo "::warning::Version-specific npm README metadata is empty or unavailable. The packaged README was already verified from the release tarball."
          elif [[ "$README_RESULT" != *"# ui-behavior-coverage"* ]]; then
            echo "::warning::Version-specific npm README metadata is populated but does not contain the expected package heading. The packaged README was already verified from the release tarball."
          else
            echo "Version-specific npm README metadata is visible."
          fi

      - name: Create or verify Git tag
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="v${RELEASE_VERSION}"

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Git tag ${TAG} already exists at the correct release commit."
            exit 0
          fi

          git tag "${TAG}" "$RELEASE_COMMIT"
          git push origin "refs/tags/${TAG}"

      - name: Create or update GitHub Release
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="v${RELEASE_VERSION}"
          TARBALL="${{ steps.pack.outputs.tarball }}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "GitHub Release ${TAG} already exists."
          else
            if [[ "$NPM_TAG" == "latest" && "$RELEASE_VERSION" != *-* ]]; then
              gh release create "${TAG}" \
                --title "${TAG}" \
                --generate-notes \
                --latest
            else
              gh release create "${TAG}" \
                --title "${TAG}" \
                --generate-notes \
                --prerelease
            fi
          fi

          gh release upload "${TAG}" "${TARBALL}#npm package" --clobber

      - name: Release summary
        if: always()
        shell: bash
        run: |
          {
            echo "## npm release"
            echo
            echo "- Version: \`${RELEASE_VERSION}\`"
            echo "- npm tag: \`${NPM_TAG}\`"
            echo "- Workflow commit: \`${GITHUB_SHA}\`"
            echo "- Release source commit: \`${RELEASE_COMMIT:-$GITHUB_SHA}\`"
            echo "- Recovery mode: \`${{ inputs.release_commit != '' }}\`"
            echo "- Dry run: \`${{ inputs.dry_run }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
