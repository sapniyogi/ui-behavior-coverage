name: External evaluation

on:
  push:
    branches:
      - agent/external-eval-5-repos
      - agent/phase-6-production-readiness
      - agent/phase-7-semantic-evidence
      - agent/phase-7-5-alpha-readiness-v2
      - agent/phase-8a-target-aware-precision
      - agent/phase-8a-corpus-expansion
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    name: ${{ matrix.slug }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: opencti
            repository: OpenCTI-Platform/opencti
            scope: opencti-platform/opencti-front
            sha: 2dfbddd21c3316bfcd1b3d7e1a35358feb9e6223
          - slug: clash-verge-rev
            repository: clash-verge-rev/clash-verge-rev
            scope: src
            sha: aadceba0642b8f58cf7c6e426ff29bf6846cbfe1
          - slug: react-admin
            repository: marmelab/react-admin
            scope: packages/ra-ui-materialui
            sha: 051f511bb0afb5ea565c2d3728bf4dab0a6fa5e0
          - slug: mui-x-data-grid
            repository: mui/mui-x
            scope: packages/x-data-grid
            sha: 17580d3dfe835b4d4b1290f50c4d95ed7b74de21
          - slug: toolpad-core
            repository: mui/toolpad
            scope: packages/toolpad-core
            sha: b2a4a69f343e98e6f3f7ebeba47dbc609c542e37
          - slug: refine-mui
            repository: refinedev/refine
            scope: packages/mui
            sha: 779d52a20e29b0307ac0df04d135beba434370dc
          - slug: mui-material
            repository: mui/material-ui
            scope: packages/mui-material
            sha: 48c6663a66b7eacbd9c7c411863ab5d18dbeea88
          - slug: rjsf-mui
            repository: rjsf-team/react-jsonschema-form
            scope: packages/mui
            sha: a99a17b9ca64622ca8bcca2cca69df567d211aa8
          - slug: react-hook-form-mui
            repository: dohomi/react-hook-form-mui
            scope: packages/rhf-mui
            sha: b19c844a3fb39778ece6f4ae19ed5c10b960346e
          - slug: react-hook-form
            repository: react-hook-form/react-hook-form
            scope: src
            sha: 06e4efdd28ec346196c38efd0909011e2f83064b
          - slug: mui-file-input
            repository: viclafouch/mui-file-input
            scope: src
            sha: 9cb067548f0fbb3ea91704aee03f5c088ab33264
          - slug: tournesol-frontend
            repository: tournesol-app/tournesol
            scope: frontend
            sha: e1f4469404ba84e19ba3c1a5779488578206b9f6
          - slug: talawa-admin
            repository: PalisadoesFoundation/talawa-admin
            scope: src
            sha: 909d2193ece3f11ea880ea4352eda3f83e02cd53
          - slug: joanie-admin
            repository: openfun/joanie
            scope: src/frontend/admin
            sha: 39177a9c90858a8072347ad89e8889f591a2a251
          - slug: jesusfilm-journeys-admin
            repository: JesusFilm/core
            scope: apps/journeys-admin
            sha: 8ef37a60461ffac3ad34f01dff425a2f1c57d6ac

    steps:
      - name: Checkout analyzer
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build analyzer
        run: |
          npm ci
          npm run build
      - name: Clone pinned target repository scope
        shell: bash
        run: |
          set -euo pipefail
          TARGET="external/${{ matrix.slug }}"
          mkdir -p "$TARGET"
          cd "$TARGET"
          git init
          git remote add origin "https://github.com/${{ matrix.repository }}.git"
          git sparse-checkout init --cone
          git sparse-checkout set "${{ matrix.scope }}"
          git fetch --depth 1 origin "${{ matrix.sha }}"
          git checkout --detach FETCH_HEAD
          ACTUAL_SHA=$(git rev-parse HEAD)
          test "$ACTUAL_SHA" = "${{ matrix.sha }}"
          printf '%s\n' "$ACTUAL_SHA" > "../${{ matrix.slug }}-sha.txt"
      - name: Inventory target scope
        shell: bash
        run: |
          set -euo pipefail
          ROOT="external/${{ matrix.slug }}/${{ matrix.scope }}"
          TEST_FILES=$(find "$ROOT" -type f \( -name '*.test.ts' -o -name '*.test.tsx' -o -name '*.test.js' -o -name '*.test.jsx' -o -name '*.spec.ts' -o -name '*.spec.tsx' -o -name '*.spec.js' -o -name '*.spec.jsx' \) | wc -l | tr -d ' ')
          TSX_FILES=$(find "$ROOT" -type f -name '*.tsx' | wc -l | tr -d ' ')
          MUI_FILES=$( { grep -RIl --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' '@mui/material' "$ROOT" 2>/dev/null || true; } | wc -l | tr -d ' ')
          printf '{"testFiles":%s,"tsxFiles":%s,"muiImportFiles":%s}\n' "$TEST_FILES" "$TSX_FILES" "$MUI_FILES" > "external/${{ matrix.slug }}-inventory.json"
          cat "external/${{ matrix.slug }}-inventory.json"
      - name: Run ui-behavior-coverage
        shell: bash
        run: |
          set -euo pipefail
          ROOT="external/${{ matrix.slug }}/${{ matrix.scope }}"
          node dist/src/cli/index.js scan "$ROOT" --json > "external/${{ matrix.slug }}-analysis.json"
          cat "external/${{ matrix.slug }}-analysis.json"
      - name: Build reproducible evaluation record
        shell: bash
        env:
          REPOSITORY: ${{ matrix.repository }}
          SCOPE: ${{ matrix.scope }}
          SLUG: ${{ matrix.slug }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const repo = process.env.REPOSITORY;
          const scope = process.env.SCOPE;
          const slug = process.env.SLUG;
          const upstreamSha = fs.readFileSync(`external/${slug}-sha.txt`, 'utf8').trim();
          const inventory = JSON.parse(fs.readFileSync(`external/${slug}-inventory.json`, 'utf8'));
          const analysis = JSON.parse(fs.readFileSync(`external/${slug}-analysis.json`, 'utf8'));
          fs.writeFileSync(`external/${slug}-evaluation.json`, JSON.stringify({ repository: repo, scope, upstreamSha, inventory, analysis }, null, 2));
          console.log(JSON.stringify({ repository: repo, scope, upstreamSha, ...inventory, discovery: analysis.discovery, scores: analysis.scores, componentsAnalyzed: analysis.componentsAnalyzed, testFilesAnalyzed: analysis.testFilesAnalyzed }, null, 2));
          NODE
      - name: Upload evaluation record
        uses: actions/upload-artifact@v4
        with:
          name: external-eval-${{ matrix.slug }}
          path: external/${{ matrix.slug }}-evaluation.json
          if-no-files-found: error

  summarize:
    name: Summary
    needs: evaluate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download evaluation records
        uses: actions/download-artifact@v4
        with:
          pattern: external-eval-*
          path: evaluation-results
          merge-multiple: true
      - name: Print combined summary
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const dir = 'evaluation-results';
          const rows = fs.existsSync(dir) ? fs.readdirSync(dir).filter((f) => f.endsWith('.json')).map((f) => JSON.parse(fs.readFileSync(path.join(dir, f), 'utf8'))) : [];
          rows.sort((a, b) => a.repository.localeCompare(b.repository));
          const combined = rows.map((row) => ({ repository: row.repository, scope: row.scope, upstreamSha: row.upstreamSha, inventory: row.inventory, componentsAnalyzed: row.analysis.componentsAnalyzed, testFilesAnalyzed: row.analysis.testFilesAnalyzed, discovery: row.analysis.discovery, scores: row.analysis.scores }));
          console.log(JSON.stringify(combined, null, 2));
          fs.writeFileSync('external-evaluation-summary.json', JSON.stringify(combined, null, 2));
          NODE
      - name: Upload combined summary
        uses: actions/upload-artifact@v4
        with:
          name: external-evaluation-summary
          path: external-evaluation-summary.json
          if-no-files-found: error
