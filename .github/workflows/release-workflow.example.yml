name: Publish package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: npm ci
      - run: node scripts/verify-release-tag.mjs
      - run: npm run release:check
      - name: Check whether package version already exists
        id: registry
        shell: bash
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish package
        if: steps.registry.outputs.exists != 'true'
        run: npm publish --access public --tag alpha
      - name: Version already published
        if: steps.registry.outputs.exists == 'true'
        run: echo "Package version already exists on npm; skipping duplicate publish."
